<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dealer Home</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <style>
:root{
      --bg:#0b0b0b;
      --panel:#0f172a;
      --card:#111827;
      --card2:#0b1220;
      --text:#f8fafc;
      --muted:#a1a1aa;
      --brand:#eab308;
      --border:rgba(255,255,255,.08);
      --shadow:0 14px 40px rgba(0,0,0,.55);
      --radius:18px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(234,179,8,.10), transparent 55%),
        radial-gradient(900px 500px at 110% 10%, rgba(59,130,246,.10), transparent 60%),
        var(--bg);
      color:var(--text);
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:22px 18px 40px;
    }

    /* Header */
    header{
      margin-bottom:18px;
      display:flex;
      align-items:center;
      gap:14px;
    }
    .logo-circle{
      width:42px;
      height:42px;
      border-radius:50%;
      background:transparent;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .logo-circle img{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    h1{
      margin:0;
      font-size:20px;
      letter-spacing:.2px;
    }
    #siteSubtitle{
      margin:4px 0 0;
      font-size:13px;
      color:var(--muted);
    }

    /* Cover */
    .cover-box{
      width:100%;
      height: clamp(170px, 22vw, 280px);
      aspect-ratio: 16 / 9;
      border-radius:var(--radius);
      overflow:hidden;
      position:relative;
      margin-bottom:22px;
      border:1px solid var(--border);
      background:linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow:var(--shadow);
    }
    #coverImage{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;

      filter:saturate(1.05) contrast(1.05);
    }
    .cover-box::after{
      content:"";
      position:absolute; inset:0;
      background:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.65) 70%, rgba(0,0,0,.85) 100%);
    }
    .cover-txt{
      position:absolute;
      left:16px;
      right:16px;
      bottom:14px;
      z-index:1;
    }
    #coverHeadline{
      margin:0 0 6px;
      font-size:20px;
    }
    #coverSubtext{
      margin:0;
      font-size:13px;
      color:rgba(255,255,255,.85);
      max-width:70ch;
      line-height:1.45;
    }


    /* ===== Cover Slider (Hi-tech) ===== */
    .cover-slider{
      position:absolute;
      inset:0;
      display:flex;
      width:100%;
      height:100%;
      transform: translateX(0);
      transition: transform .42s ease;
      will-change: transform;
    }
    .cover-slide{
      min-width:100%;
      height:100%;
      position:relative;
    }
    .cover-slide a, .cover-slide div{
      display:block;
      width:100%;
      height:100%;
    }
    .cover-slide img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;

      filter:saturate(1.05) contrast(1.05);
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none; /* drag on container */
    }

    .cover-nav{
      position:absolute;
      top:50%;
      transform: translateY(-50%);
      width:44px;
      height:44px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.35);
      color: rgba(255,255,255,.92);
      font-size:26px;
      line-height: 1;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index: 2;
      backdrop-filter: blur(6px);
    }
    .cover-nav:hover{ background: rgba(0,0,0,.48); border-color: rgba(234,179,8,.40); }
    .cover-nav.prev{ left:12px; }
    .cover-nav.next{ right:12px; }

    .cover-dots{
      position:absolute;
      left:16px;
      right:16px;
      bottom:12px;
      display:flex;
      gap:8px;
      justify-content:center;
      z-index:2;
      pointer-events:auto;
    }
    .cover-dot{
      width:8px;
      height:8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.10);
      cursor:pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .cover-dot.active{
      background: rgba(234,179,8,.75);
      border-color: rgba(234,179,8,.85);
      transform: scale(1.25);
    }

    /* Hide arrows on very small screens; swipe still works */
    @media (max-width: 640px){
      .cover-nav{ display:none; }
      .cover-dots{ bottom:10px; }
      .cover-txt{ left:14px; right:14px; bottom:16px; }
    }

    /* Grid */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
      gap:18px;
    }

    /* Card */
    .card{
      background:linear-gradient(180deg, var(--card), var(--card2));
      border-radius:var(--radius);
      overflow:hidden;
      border:1px solid var(--border);
      text-decoration:none;
      color:inherit;
      box-shadow:0 10px 28px rgba(0,0,0,.45);
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      display:flex;
      flex-direction:column;
      height:100%;
      position:relative;
    }
    .card:hover{
      transform:translateY(-6px);
      border-color:rgba(234,179,8,.75);
      box-shadow:0 18px 55px rgba(0,0,0,.65), 0 0 25px rgba(234,179,8,.18);
    }

    /* Image */
    .thumb{
      aspect-ratio: 1 / 1;
      border-top-left-radius: var(--radius);
      border-top-right-radius: var(--radius);
      background:rgba(255,255,255,.04);
      position:relative;
      overflow:hidden;
    }
    /* Square category thumbnails (800x800 to 1500x1500) */
    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      transition:transform .4s ease;
    }
    .card:hover .thumb img{
      transform:scale(1.05);
    }
    .thumb::after{
      content:"";
      position:absolute;
      inset:0;
      /* subtle top/bottom vignette (keeps image premium but does NOT hold text) */
      background:linear-gradient(180deg, rgba(0,0,0,.20) 0%, transparent 40%, rgba(0,0,0,.35) 100%);
      pointer-events:none;
    }

    /* Caption area UNDER image */
    .label{
      padding: 12px 14px 14px;
      display:flex;
      flex-direction:column;
      gap:4px;
      background: linear-gradient(180deg, rgba(12,16,26,.70), rgba(10,14,22,.85));
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .title-en{
      font-size:13px;
      font-weight:850;
      letter-spacing:.6px;
      color:#eab308;
      text-transform:uppercase;
      line-height:1.15;
    }
    .title-th{
      font-size:15px;
      font-weight:900;
      line-height:1.35;
      color:#fff;
      display:-webkit-box;
      -webkit-line-clamp:2;
      line-clamp: 2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .placeholder{
      position:absolute; inset:0;
      display:grid; place-items:center;
      font-weight:800;
      color:rgba(255,255,255,.18);
    }

    /* Content */

    /* Mobile */
    @media (max-width:640px){
      /* caption tighter */
      .label{ padding: 11px 12px 13px; }

      .wrap{ padding:18px 14px 34px; }
      h1{ font-size:18px; }
      .cover-box{ height: clamp(160px, 40vw, 220px); }
      .grid{ grid-template-columns:1fr; gap:14px; }
    }
  
        /* ===== Sticky LINE CTA ===== */
    .line-sticky{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 28px;

      background: linear-gradient(90deg, #06C755, #04a548);
      color: #fff;
      font-weight: 900;
      text-align: center;
      padding: 14px 14px;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: .3px;

      z-index: 999;
      box-shadow: 0 12px 28px rgba(0,0,0,.48);
      display: block;

      max-width: 520px;
      width: calc(100% - 32px);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(6px);
    }
    .line-sticky:hover{ filter: brightness(1.05); }
    .line-sticky:active{ transform: translateX(-50%) scale(.98); }

    body{ padding-bottom:120px; } /* desktop prevent overlap */

    /* Mobile: full-width bar like native CTA */
    @media (max-width: 768px){
      @keyframes softPulseMobile {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }
      .line-sticky.pulse {
        animation: softPulseMobile 6s ease-in-out infinite;
      }
    }
    @media (prefers-reduced-motion: reduce){
      .line-sticky.pulse { animation: none; }
    }

/* ===== Dealer Zone extras (ใช้สีจากเว็บหลัก) ===== */
.dealerCard{
  border:1px solid var(--border);
  background:linear-gradient(180deg, var(--card), var(--card2));
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
}
.dealerStack{ display:flex; flex-direction:column; gap:10px; max-width:520px; }
.dealerBtn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding: 12px 14px;
  border-radius: 16px;
  border:1px solid rgba(234,179,8,.40);
  background: rgba(234,179,8,.10);
  color: var(--text);
  font-weight: 900;
  text-decoration:none;
  cursor:pointer;
}
.dealerBtn.secondary{
  border-color: rgba(255,255,255,.14);
  background: rgba(255,255,255,.06);
}
.dealerBtn:hover{ filter: brightness(1.05); }
.dealerInput{
  width: min(520px, 100%);
  padding: 13px 14px;
  border-radius: 16px;
  border:1px solid rgba(255,255,255,.14);
  background: rgba(0,0,0,.22);
  color: var(--text);
  outline:none;
  font-size: 15px;
}
.dealerInput:focus{
  border-color: rgba(234,179,8,.55);
  box-shadow: 0 0 0 4px rgba(234,179,8,.08);
}
.dealerRow{ display:flex; gap:10px; flex-wrap:wrap; }
.smallMuted{ color: var(--muted); font-size: 13px; line-height:1.45; }

  </style>

  <script src="config.js"></script>
<script src="auth.js"></script>
<script>checkAuth();</script>

</head>

<body>
  <div class="wrap">
    <header>
      <div class="logo-circle">
        <img src="/assets/uploads/leeplus-logo.png" alt="LEEPLUS" loading="eager" decoding="async">
      </div>

      <div style="flex:1 1 auto; min-width:0;">
        <h1>LEEPLUS</h1>
        <p id="siteSubtitle">Dealer Zone</p>
      </div>

      <div class="dealerRow" style="justify-content:flex-end;">
        <a class="dealerBtn secondary" href="/" style="padding:10px 12px; border-radius:14px;">กลับหน้าเว็บหลัก</a>
        <button class="dealerBtn secondary" onclick="logout()" style="padding:10px 12px; border-radius:14px;">ออกจากระบบ</button>
      </div>
    </header>

    <div class="cover-box" style="height:auto; aspect-ratio:auto; padding:16px; display:block;">
  <div class="cover-txt" style="position:relative; left:auto; right:auto; bottom:auto;">
    <h2 id="coverHeadline" style="margin:0 0 6px;">เมนูตัวแทน</h2>
    <p id="coverSubtext" class="smallMuted" style="margin:0;">เลือกเมนูที่ต้องการ</p>
  </div>
</div>

<div class="dealerStack">
  <a class="dealerBtn" href="catalog.html">ดาวน์โหลดแคตตาล็อก</a>
  <a class="dealerBtn secondary" href="terms.html">เงื่อนไข / วิธีสั่งซื้อ</a>
  <a class="dealerBtn secondary" href="register.html">สมัครตัวแทน</a>
</div>

  </div>
</body>
</html>
