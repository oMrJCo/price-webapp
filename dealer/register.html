<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>สมัครตัวแทน • LEEPLUS</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script>
  // ===== Dealer Area Guard (client-side) =====
  // เปลี่ยนรหัสได้ โดยแก้ค่า DEALER_PASS ให้ตรงกันทุกหน้าในโฟลเดอร์ /dealer/
  const DEALER_PASS = "LEEPLUS2026";
  if (sessionStorage.getItem("dealer_ok") !== "1") {
    location.replace("/dealer/");
  }
</script>
  <style>
    :root{--bg:#0b0b0b; --text:#f8fafc; --muted:#a1a1aa; --border:rgba(255,255,255,.10); --radius:18px; --brand:#eab308;}
    *{box-sizing:border-box}
    body{margin:0; background:var(--bg); color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", Arial, sans-serif;
      padding:22px;
    }
    .wrap{max-width:880px; margin:0 auto;}
    .card{background: linear-gradient(180deg, rgba(17,24,39,.92), rgba(12,18,32,.92)); border:1px solid var(--border); border-radius:var(--radius);
      padding:16px; box-shadow:0 18px 50px rgba(0,0,0,.45);
    }
    h1{margin:0 0 6px; font-size:18px; font-weight:950;}
    p{margin:0 0 12px; color:var(--muted); font-size:13px; line-height:1.5;}
    .row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
    @media (max-width: 760px){ .row{grid-template-columns:1fr;} }
    input, textarea{width:100%; padding:12px 12px; border-radius:14px; border:1px solid rgba(255,255,255,.12);
      background: rgba(2,6,23,.55); color: var(--text); outline:none; font-size:14px;
    }
    textarea{min-height:120px; resize:vertical;}
    a.back{display:inline-block; margin-top:12px; color:var(--brand); text-decoration:none; font-weight:900;}
    .note{margin-top:10px; font-size:12px; color:rgba(255,255,255,.55);}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>สมัครตัวแทน</h1>
      <p>หน้านี้เป็นตัวอย่างฟอร์ม (ยังไม่ส่งข้อมูลจริง) — ถ้าพี่ต้องการให้ส่งเข้ากลูเกิลฟอร์มหรือส่งเข้าไลน์ ผมทำให้ได้</p>
      <div class="row">
        <input placeholder="ชื่อร้าน / บริษัท" />
        <input placeholder="ชื่อผู้ติดต่อ" />
        <input placeholder="เบอร์โทร" />
        <input placeholder="อีเมล" />
      </div>
      <textarea placeholder="รายละเอียดเพิ่มเติม เช่น จังหวัด/ประเภทสินค้า/ช่องทางการขาย"></textarea>
      <div class="note">* หากต้องการให้ฟอร์มส่งจริง แนะนำเชื่อม Google Forms (ง่ายและฟรี)</div>
      <a class="back" href="/dealer/home.html">← กลับเมนูตัวแทน</a>
    </div>
  </div>
</body>
</html>
