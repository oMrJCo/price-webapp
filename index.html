  <style>
    :root{
      --bg:#0b0b0b;
      --panel:#0f172a;
      --card:#111827;
      --card2:#0b1220;
      --text:#f8fafc;
      --muted:#a1a1aa;
      --brand:#eab308;
      --border:rgba(255,255,255,.08);
      --shadow:0 14px 40px rgba(0,0,0,.55);
      --radius:18px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(234,179,8,.10), transparent 55%),
        radial-gradient(900px 500px at 110% 10%, rgba(59,130,246,.10), transparent 60%),
        var(--bg);
      color:var(--text);
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:22px 18px 40px;
    }

    /* Header */
    header{
      margin-bottom:18px;
      display:flex;
      align-items:center;
      gap:14px;
    }
    .logo-circle{
      width:42px;
      height:42px;
      border-radius:50%;
      background:transparent;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .logo-circle img{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    h1{
      margin:0;
      font-size:20px;
      letter-spacing:.2px;
    }
    #siteSubtitle{
      margin:4px 0 0;
      font-size:13px;
      color:var(--muted);
    }

    /* Cover */
    .cover-box{
      width:100%;
      height: clamp(170px, 22vw, 280px);
      aspect-ratio: 16 / 9;
      border-radius:var(--radius);
      overflow:hidden;
      position:relative;
      margin-bottom:22px;
      border:1px solid var(--border);
      background:linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow:var(--shadow);
    }
    #coverImage{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;

      filter:saturate(1.05) contrast(1.05);
    }
    .cover-box::after{
      content:"";
      position:absolute; inset:0;
      background:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.65) 70%, rgba(0,0,0,.85) 100%);
    }
    .cover-txt{
      position:absolute;
      left:16px;
      right:16px;
      bottom:14px;
      z-index:1;
    }
    #coverHeadline{
      margin:0 0 6px;
      font-size:20px;
    }
    #coverSubtext{
      margin:0;
      font-size:13px;
      color:rgba(255,255,255,.85);
      max-width:70ch;
      line-height:1.45;
    }


    /* ===== Cover Slider (Hi-tech) ===== */
    .cover-slider{
      position:absolute;
      inset:0;
      display:flex;
      width:100%;
      height:100%;
      transform: translateX(0);
      transition: transform .42s ease;
      will-change: transform;
    }
    .cover-slide{
      min-width:100%;
      height:100%;
      position:relative;
    }
    .cover-slide a, .cover-slide div{
      display:block;
      width:100%;
      height:100%;
    }
    .cover-slide img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;

      filter:saturate(1.05) contrast(1.05);
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none; /* drag on container */
    }

    .cover-nav{
      position:absolute;
      top:50%;
      transform: translateY(-50%);
      width:44px;
      height:44px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.35);
      color: rgba(255,255,255,.92);
      font-size:26px;
      line-height: 1;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index: 2;
      backdrop-filter: blur(6px);
    }
    .cover-nav:hover{ background: rgba(0,0,0,.48); border-color: rgba(234,179,8,.40); }
    .cover-nav.prev{ left:12px; }
    .cover-nav.next{ right:12px; }

    .cover-dots{
      position:absolute;
      left:16px;
      right:16px;
      bottom:12px;
      display:flex;
      gap:8px;
      justify-content:center;
      z-index:2;
      pointer-events:auto;
    }
    .cover-dot{
      width:8px;
      height:8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.10);
      cursor:pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .cover-dot.active{
      background: rgba(234,179,8,.75);
      border-color: rgba(234,179,8,.85);
      transform: scale(1.25);
    }

    /* Hide arrows on very small screens; swipe still works */
    @media (max-width: 640px){
      .cover-nav{ display:none; }
      .cover-dots{ bottom:10px; }
      .cover-txt{ left:14px; right:14px; bottom:16px; }
    }

    /* Grid */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
      gap:18px;
    }

    /* Card */
    .card{
      background:linear-gradient(180deg, var(--card), var(--card2));
      border-radius:var(--radius);
      overflow:hidden;
      border:1px solid var(--border);
      text-decoration:none;
      color:inherit;
      box-shadow:0 10px 28px rgba(0,0,0,.45);
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      display:flex;
      flex-direction:column;
      height:100%;
      position:relative;
    }
    .card:hover{
      transform:translateY(-6px);
      border-color:rgba(234,179,8,.75);
      box-shadow:0 18px 55px rgba(0,0,0,.65), 0 0 25px rgba(234,179,8,.18);
    }

    /* Image */
    .thumb{
      aspect-ratio: 1 / 1;
      border-top-left-radius: var(--radius);
      border-top-right-radius: var(--radius);
      background:rgba(255,255,255,.04);
      position:relative;
      overflow:hidden;
    }
    /* Square category thumbnails (800x800 to 1500x1500) */
    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      transition:transform .4s ease;
    }
    .card:hover .thumb img{
      transform:scale(1.05);
    }
    .thumb::after{
      content:"";
      position:absolute;
      inset:0;
      /* subtle top/bottom vignette (keeps image premium but does NOT hold text) */
      background:linear-gradient(180deg, rgba(0,0,0,.20) 0%, transparent 40%, rgba(0,0,0,.35) 100%);
      pointer-events:none;
    }

    /* Caption area UNDER image */
    .label{
      padding: 12px 14px 14px;
      display:flex;
      flex-direction:column;
      gap:4px;
      background: linear-gradient(180deg, rgba(12,16,26,.70), rgba(10,14,22,.85));
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .title-en{
      font-size:13px;
      font-weight:850;
      letter-spacing:.6px;
      color:#eab308;
      text-transform:uppercase;
      line-height:1.15;
    }
    .title-th{
      font-size:15px;
      font-weight:900;
      line-height:1.35;
      color:#fff;
      display:-webkit-box;
      -webkit-line-clamp:2;
      line-clamp: 2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .placeholder{
      position:absolute; inset:0;
      display:grid; place-items:center;
      font-weight:800;
      color:rgba(255,255,255,.18);
    }

    /* Content */

    /* Mobile */
    @media (max-width:640px){
      /* caption tighter */
      .label{ padding: 11px 12px 13px; }

      .wrap{ padding:18px 14px 34px; }
      h1{ font-size:18px; }
      .cover-box{ height:auto; }
      .grid{ grid-template-columns:1fr; gap:14px; }
    }
  
        /* ===== Sticky LINE CTA ===== */
    .line-sticky{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 28px;

      background: linear-gradient(90deg, #06C755, #04a548);
      color: #fff;
      font-weight: 900;
      text-align: center;
      padding: 14px 14px;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: .3px;

      z-index: 999;
      box-shadow: 0 12px 28px rgba(0,0,0,.48);
      display: block;

      max-width: 520px;
      width: calc(100% - 32px);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(6px);
    }
    .line-sticky:hover{ filter: brightness(1.05); }
    .line-sticky:active{ transform: translateX(-50%) scale(.98); }

    body{ padding-bottom:120px; } /* desktop prevent overlap */

    /* Mobile: full-width bar like native CTA */
    @media (max-width: 768px){
      @keyframes softPulseMobile {
        0%, 100% { transform: translateX(-50%) scale(1); }
        50% { transform: translateX(-50%) scale(1.02); }
      }
      .line-sticky.pulse {
        animation: softPulseMobile 6s ease-in-out infinite;
      }
    }
    @media (prefers-reduced-motion: reduce){
      .line-sticky.pulse { animation: none; }
    }


    /* ===== Top Right Dealer Nav ===== */
    .topNav{
      margin-left:auto;
      display:flex;
      align-items:center;
    }

    .dealerNavBtn{
      padding:8px 14px;
      border-radius:999px;
      border:1px solid rgba(234,179,8,.4);
      background:rgba(234,179,8,.12);
      color:var(--text);
      font-weight:900;
      text-decoration:none;
      letter-spacing:.3px;
      font-size:13px;
      transition:all .2s ease;
    }

    .dealerNavBtn:hover{
      transform:translateY(-2px);
      filter:brightness(1.05);
      border-color:rgba(234,179,8,.7);
    }



    /* ===== Phase 5A — Frontend UI Refresh ===== */
    .wrap{
      max-width:1280px;
      padding:18px 24px 48px;
    }

    header{
      min-height:58px;
      margin-bottom:14px;
      gap:12px;
      padding:0 2px;
    }
    .logo-circle{
      width:48px;
      height:48px;
      border-radius:12px;
    }
    h1{
      font-size:21px;
      font-weight:900;
      letter-spacing:.25px;
    }
    #siteSubtitle{
      margin-top:2px;
      font-size:12px;
      line-height:1.4;
      color:rgba(255,255,255,.62);
    }
    .dealerNavBtn{
      min-height:40px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 18px;
      border-radius:999px;
      border:1px solid rgba(234,179,8,.55);
      background:rgba(234,179,8,.06);
      color:#fff;
      font-size:13px;
      font-weight:850;
      text-decoration:none;
      transition:.18s ease;
    }
    .dealerNavBtn:hover{
      background:#eab308;
      color:#090b10;
      border-color:#eab308;
    }

    /* Artwork spec = 1600x500 (16:5). Frontend now uses the exact same ratio. */
    .cover-box{
      width:100%;
      height:auto;
      aspect-ratio:16 / 5;
      min-height:0;
      max-height:none;
      margin-bottom:24px;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.10);
      background:#07090d;
      box-shadow:0 16px 48px rgba(0,0,0,.34);
    }
    .cover-slide img,
    #coverImage{
      object-fit:cover;
      object-position:center;
      filter:none;
    }
    .cover-box::after{
      background:linear-gradient(180deg, rgba(0,0,0,.02), rgba(0,0,0,.12));
      pointer-events:none;
    }
    .cover-txt{
      left:24px;
      right:90px;
      bottom:22px;
      padding:12px 14px;
      width:max-content;
      max-width:min(680px,70%);
      border-radius:12px;
      background:rgba(5,7,11,.58);
      backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,.08);
    }
    .cover-txt.is-empty{display:none}
    #coverHeadline{font-size:18px;margin-bottom:3px}
    #coverSubtext{font-size:12px}
    .cover-nav{
      width:38px;
      height:38px;
      font-size:22px;
      background:rgba(5,7,11,.54);
      border-color:rgba(255,255,255,.20);
    }
    .cover-nav.prev{left:14px}
    .cover-nav.next{right:14px}
    .cover-dots{
      bottom:12px;
      gap:6px;
    }
    .cover-dot{
      width:22px;
      height:4px;
      border:0;
      border-radius:999px;
      background:rgba(255,255,255,.30);
    }
    .cover-dot.active{
      width:34px;
      transform:none;
      background:#eab308;
    }

    .grid{
      grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
      gap:16px;
    }
    .card{
      border-radius:18px;
      border-color:rgba(255,255,255,.09);
      box-shadow:0 8px 28px rgba(0,0,0,.28);
      background:#0d1119;
    }
    .card:hover{
      transform:translateY(-4px);
      box-shadow:0 14px 36px rgba(0,0,0,.42),0 0 0 1px rgba(234,179,8,.35);
    }
    .thumb{
      border-radius:0;
      background:#111722;
    }
    .thumb::after{
      background:linear-gradient(180deg, transparent 62%, rgba(0,0,0,.28));
    }
    .label{
      min-height:74px;
      padding:12px 14px 14px;
      gap:3px;
      background:#0d1119;
      border-top-color:rgba(255,255,255,.07);
    }
    .title-en{
      font-size:11px;
      letter-spacing:.7px;
      color:#eab308;
    }
    .title-th{
      font-size:15px;
      line-height:1.25;
    }

    @media(max-width:760px){
      .wrap{padding:14px 12px 34px}
      header{align-items:flex-start;flex-wrap:wrap}
      .logo-circle{width:42px;height:42px}
      .topNav{margin-left:auto}
      .dealerNavBtn{min-height:36px;padding:0 12px;font-size:11px}
      #siteSubtitle{max-width:70vw}
      .cover-box{
        aspect-ratio:16 / 7;
        border-radius:16px;
        margin-bottom:16px;
      }
      .cover-txt{
        left:12px;right:12px;bottom:12px;
        max-width:calc(100% - 24px);
        padding:9px 10px;
      }
      #coverHeadline{font-size:15px}
      #coverSubtext{font-size:11px}
      .cover-dots{bottom:7px}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      .label{min-height:68px;padding:10px 10px 12px}
      .title-th{font-size:13px}
      .title-en{font-size:10px}
      .line-sticky{bottom:12px}
    }


.contact-bar{display:flex;gap:8px;flex-wrap:wrap;margin:-3px 0 14px 62px}.contact-pill{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.12);color:#fff;text-decoration:none;font-size:11px;font-weight:800;background:#111722}.contact-pill.line{border-color:rgba(6,199,85,.40)}.contact-pill.facebook{border-color:rgba(24,119,242,.45)}.contact-pill.phone{border-color:rgba(234,179,8,.40)}

/* Phase 5B.2 — Header logo fallback + Contact bar polish */
.logo-image-failed .logo-circle{display:none!important}
.logo-image-failed header::before{
  content:"LP";width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;
  border-radius:12px;background:linear-gradient(145deg,#f2c300,#111 78%);
  color:#fff;font-size:12px;font-weight:950;letter-spacing:.5px;border:1px solid rgba(242,195,0,.35);
}
.contact-bar{
  margin:0 0 16px 0!important;padding:10px 12px;border:1px solid rgba(255,255,255,.08);
  border-radius:14px;background:rgba(13,17,25,.72);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:8px;
}
.contact-bar::before{
  content:"ติดต่อเรา";color:rgba(255,255,255,.48);font-size:10px;font-weight:800;
  letter-spacing:.5px;margin-right:2px;
}
.contact-pill{
  min-height:36px!important;padding:0 14px!important;border-radius:10px!important;
  background:#0a0e15!important;font-size:11px!important;font-weight:900!important;transition:.18s ease;
}
.contact-pill:hover{transform:translateY(-1px);filter:brightness(1.12)}
.contact-pill.line{border-color:rgba(6,199,85,.55)!important}
.contact-pill.facebook{border-color:rgba(24,119,242,.60)!important}
.contact-pill.phone{

  .contact-bar{padding:8px;gap:6px}.contact-bar::before{display:none}

}

.contact-bar{
  margin:0 0 16px!important;
  padding:12px!important;
  display:grid!important;
  grid-template-columns:minmax(180px,.85fr) repeat(3,minmax(190px,1fr));
  gap:10px!important;
  align-items:stretch!important;
  border:1px solid rgba(255,255,255,.075)!important;
  border-radius:18px!important;
  background:linear-gradient(180deg,rgba(255,255,255,.018),transparent),#0f131a!important;
  box-shadow:0 12px 34px rgba(0,0,0,.20);
}
.contact-bar::before{display:none!important}

.contact-intro,
.contact-card{
  min-height:72px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.075);
  background:#111720;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 13px;
  min-width:0;
}
.contact-intro{
  color:#fff;
  background:linear-gradient(135deg,rgba(243,201,0,.055),transparent 58%),#111720;
}

  display:block;
  color:#f4f6f8;

  margin-top:4px;
  color:#7f8997;

}

}
.contact-card:hover{transform:translateY(-2px);filter:brightness(1.08)}

.line-logo{background:#08c755;color:#fff;border-radius:50%}
.line-logo span{font-size:9px;font-weight:950;letter-spacing:-.3px}
.facebook-logo{background:#1877f2;color:#fff;border-radius:50%;font-family:Arial,sans-serif;font-size:29px;font-weight:900;line-height:1;padding-top:5px}
.phone-logo{color:#f3c900;background:rgba(243,201,0,.075);border:1px solid rgba(243,201,0,.24);border-radius:50%}
.phone-logo svg{fill:currentColor;stroke:none;width:21px;height:21px}
.contact-arrow{font-size:26px;color:#626c79;font-weight:300;margin-left:2px}
.contact-line .contact-arrow{color:#22d66c}
.contact-facebook .contact-arrow{color:#4794f2}
.contact-phone .contact-arrow{color:#f0c400}

@media(max-width:980px){
  .contact-bar{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
  }
}
@media(max-width:600px){
  .contact-bar{
    grid-template-columns:1fr!important;
    padding:9px!important;
    gap:7px!important;
    border-radius:15px!important;
  }
  .contact-intro,.contact-card{
    min-height:60px;
    padding:9px 11px;
    border-radius:12px;
  }
  .contact-icon{width:38px;height:38px;flex-basis:38px;border-radius:10px}
  .contact-intro b,.contact-copy b{font-size:12px}
}


/* Phase 7A — Price Section Heading */
.price-section-heading{
  display:grid;
  grid-template-columns:minmax(40px,1fr) auto minmax(40px,1fr);
  align-items:center;
  gap:22px;
  margin:18px 0 16px;
  padding:16px 20px;
  border:1px solid rgba(255,255,255,.075);
  border-radius:18px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.018),transparent),
    #0f131a;
}
.price-section-line{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(243,201,0,.72));
}
.price-section-line:last-child{
  background:linear-gradient(90deg,rgba(243,201,0,.72),transparent);
}
.price-section-center{
  display:flex;
  align-items:center;
  gap:12px;
}
.price-section-icon{
  width:46px;height:46px;flex:0 0 46px;
  display:grid;place-items:center;
  border-radius:50%;
  color:#f3c900;
  border:1px solid rgba(243,201,0,.55);
  background:rgba(243,201,0,.06);
}
.price-section-icon svg{
  width:22px;height:22px;
  fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
}
.price-section-copy{text-align:center}
.price-section-copy h2{
  margin:0;
  color:#f4f6f8;
  font-size:22px;
  line-height:1.05;
  font-weight:950;
}
.price-section-copy h2 span{color:#f3c900}
.price-section-copy p{
  margin:6px 0 0;
  color:#7f8895;
  font-size:10px;
  font-weight:700;
}
@media(max-width:720px){
  .price-section-heading{
    grid-template-columns:1fr;
    gap:8px;
    padding:12px;
    margin:12px 0 11px;
  }
  .price-section-line{display:none}
  .price-section-center{justify-content:center}
  .price-section-icon{width:38px;height:38px;flex-basis:38px}
  .price-section-copy h2{font-size:18px}
  .price-section-copy p{font-size:9px}
}

</style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="logo-circle">
        <img id="siteLogo" src="" alt="" style="display:none" loading="eager" decoding="async">
      </div>

      <div style="flex:1;">
        <h1 id="siteTitle">LEEPLUS</h1>
        <p id="siteSubtitle">กำลังโหลด...</p>
      </div>

      <nav class="topNav">
        <button type="button" class="dealerNavBtn" id="dealerAccessBtn">ราคาตัวแทนจำหน่าย</button>
      </nav>
    </header>
<div id="contactBar" class="contact-bar" style="display:none"></div>

    <div class="cover-box" aria-label="โปรโมชั่นและสินค้าแนะนำ">
      <div id="coverSlider" class="cover-slider" role="region" aria-roledescription="carousel" aria-label="Cover Slider">
        <!-- slides injected by app.js -->
      </div>

      <button class="cover-nav prev" id="coverPrev" type="button" aria-label="รูปก่อนหน้า">‹</button>
      <button class="cover-nav next" id="coverNext" type="button" aria-label="รูปถัดไป">›</button>

      <div class="cover-dots" id="coverDots" aria-label="ตัวบ่งชี้สไลด์"></div>

      <div class="cover-txt">
        <h2 id="coverHeadline"></h2>
        <p id="coverSubtext"></p>
      </div>
    </div>

    
<section class="price-section-heading" aria-label="รายการราคาสินค้า">
  <div class="price-section-line"></div>
  <div class="price-section-center">
    <div class="price-section-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M20 13 11 22 2 13V4h9l9 9Z"/><circle cx="7" cy="9" r="1.5"/></svg>
    </div>
    <div class="price-section-copy">
      <h2>รายการ<span>ราคา</span>สินค้า</h2>
      <p>เลือกหมวดสินค้าเพื่อดูรายการราคาและดาวน์โหลดใบราคา</p>
    </div>
  </div>
  <div class="price-section-line"></div>
</section>

<div id="categoriesGrid" class="grid"></div>

<div id="dealerAccessModal" class="dealer-access-modal" aria-hidden="true">
  <div class="dealer-access-card">
    <button class="dealer-access-close" id="dealerAccessClose" type="button">×</button>
    <div class="dealer-access-brand">LEEPLUS <span>DEALER</span></div>
    <h2>ราคาตัวแทนจำหน่าย</h2><p>กรอกรหัสเพื่อเข้าสู่รายการราคาตัวแทน</p>
    <input id="dealerAccessCode" type="password" placeholder="รหัสตัวแทน">
    <button id="dealerAccessSubmit" class="dealer-access-submit" type="button">เข้าสู่ระบบ</button>
    <div id="dealerAccessError" class="dealer-access-error"></div>
  </div>
</div>
<script>
(function(){
 const API="https://script.google.com/macros/s/AKfycbxqUpwXOo05dZ1iv9BP29pVR273Qj1d8fXwYZnn29A9cpNfrAtE0IKL7uqO-DXopIgUYA/exec",modal=document.getElementById("dealerAccessModal"),input=document.getElementById("dealerAccessCode"),err=document.getElementById("dealerAccessError");
 function open(){modal.classList.add("show");setTimeout(()=>input.focus(),50)} function close(){modal.classList.remove("show");input.value="";err.textContent=""}
 document.getElementById("dealerAccessBtn")?.addEventListener("click",open);document.getElementById("dealerAccessClose")?.addEventListener("click",close);modal?.addEventListener("click",e=>{if(e.target===modal)close()});
 async function submit(){const code=input.value.trim();if(!code)return;err.textContent="กำลังตรวจสอบ...";try{const r=await fetch(`${API}?action=dealerLogin&code=${encodeURIComponent(code)}&t=${Date.now()}`,{cache:"no-store"});const j=await r.json();if(j.authorized){sessionStorage.setItem("leeplus_dealer_auth","1");sessionStorage.removeItem("leeplus_dealer_token");location.href="/dealer/home.html"}else{err.textContent="รหัสไม่ถูกต้อง";input.select()}}catch(e){err.textContent="เชื่อมต่อระบบไม่สำเร็จ"}}catch(e){err.textContent="เชื่อมต่อระบบไม่สำเร็จ"}}
 document.getElementById("dealerAccessSubmit")?.addEventListener("click",submit);input?.addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
})();
</script>
