<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Dealer Home</title>
<link rel="icon" href="/favicon.ico">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- พยายามดึง CSS เดียวกับหน้าเว็บหลัก (ถ้าไฟล์ไหนมีอยู่จะถูกใช้) -->
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="stylesheet" href="/assets/css/main.css">

<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#0b0f14; color:#e8eef6; }
  .container { max-width: 1100px; margin: 0 auto; padding: 18px; }
  header { position: sticky; top:0; background: rgba(11,15,20,.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,.08); }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding: 12px 18px; }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
  .brand img { height: 34px; width:auto; display:block; }
  .brand span { font-weight: 700; letter-spacing:.2px; }
  .nav { display:flex; gap:10px; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 14px; border-radius: 12px; border:1px solid rgba(255,255,255,.14); color:#e8eef6; background: rgba(255,255,255,.06); text-decoration:none; cursor:pointer; }
  .btn.primary { border-color: rgba(255,200,70,.35); box-shadow: 0 0 0 1px rgba(255,200,70,.12) inset; }
  .btn:hover { background: rgba(255,255,255,.10); }
  main { padding: 18px 0 42px; }
  .hero { padding: 22px 0 6px; }
  .hero h1 { margin:0 0 6px; font-size: 24px; }
  .muted { opacity:.8; }
  .stack { display:flex; flex-direction:column; gap:10px; margin-top: 16px; max-width: 520px; }
  .card { border:1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.04); border-radius: 16px; padding: 16px; }
  input { width: min(420px, 92vw); padding: 12px 12px; border-radius: 12px; border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); color:#e8eef6; font-size: 16px; }
  footer { border-top: 1px solid rgba(255,255,255,.08); padding: 18px 0; opacity:.85; }
</style>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>checkAuth();</script>

</head>
<body>
<header>
  <div class="topbar">
    <a class="brand" href="/" aria-label="กลับหน้าแรก">
      <img src="/assets/logo.png" alt="LEEPLUS" onerror="this.style.display='none'">
      <span>LEEPLUS</span>
    </a>
    <nav class="nav">
      <a class="btn" href="/price_sheet.html">ราคา</a>
      <a class="btn" href="/contact.html">ติดต่อ</a>
      <button class="btn" onclick="logout()">ออกจากระบบ</button>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <section class="hero">
  <h1>เมนูตัวแทน</h1>
  <div class="muted">เลือกเมนูด้านล่าง</div>
</section>

<div class="stack">
  <a class="btn primary" href="catalog.html">ดาวน์โหลดแคตตาล็อก</a>
  <a class="btn" href="terms.html">เงื่อนไข/วิธีสั่งซื้อ</a>
  <a class="btn" href="register.html">สมัครตัวแทน</a>
</div>

  </div>
</main>

<footer>
  <div class="container muted">
    © LEEPLUS — Dealer Zone
  </div>
</footer>
</body>
</html>
