<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LEEPLUS ราคา (Sheet)</title>

  <style>
    :root{
      --bg:#0b0f19;
      --text:#f8fafc;
      --muted:#a1a1aa;
      --brand:#eab308;
      --danger:#ff3b30;
      --border:rgba(255,255,255,.08);
      --shadow:0 14px 40px rgb(0 0 0 / .55);
      --max:1160px;

      --rowbg: rgba(0,0,0,.16);
      --rowbg2: rgba(255,255,255,.02);
      --rowline: rgba(255,255,255,.06);

      --priceCol: 140px;
      --priceColSm: 118px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans Thai", sans-serif;
      background: var(--bg);
      color:var(--text);
      padding:24px 14px;
    }

    a{ color:inherit; text-decoration:none; }
    .wrap{ max-width:var(--max); margin:0 auto; }

    .topbar{
      background: rgba(255,255,255,.04);
      border:1px solid var(--border);
      border-radius:22px;
      padding:18px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      box-shadow: var(--shadow);
    }

    .left{
      display:flex;
      align-items:flex-start;
      gap:12px;
      min-width:0;
      flex:1 1 auto;
    }

    /* ✅ actions แนวนอน */
    .actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex:0 0 auto;
      white-space:nowrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:12px;
      background: rgba(255,255,255,.06);
      border:1px solid var(--border);
      color:var(--text);
      font-weight:800;
      font-size:14px;
      cursor:pointer;
      user-select:none;
      transition:.15s;
    }
    .btn:hover{ background: rgba(255,255,255,.10); }
    .btn-secondary{
      background: rgba(234,179,8,.12);
      border-color: rgba(234,179,8,.28);
      font-weight:900;
    }

    /* ✅ แคปชั่นซ้าย + ลูกศร */
    .pdfHintLeft{
      display:none;
      align-items:center;
      gap:6px;
      color:var(--danger);
      font-size:13px;
      font-weight:900;
      text-shadow:0 0 10px rgba(255,59,48,.35);
    }

    .pdfHintLeft .arrow{
      font-size:16px;
      animation: nudge 1.4s infinite;
    }

    @keyframes nudge{
      0%,100%{ transform: translateX(0); opacity:.7; }
      50%{ transform: translateX(4px); opacity:1; }
    }

    /* โชว์ hint เมื่อมี PDF */
    .actions.has-pdf .pdfHintLeft{
      display:flex;
    }

    .titlebox{ min-width:0; }
    .crumb{ margin:0; font-size:12px; color:var(--muted); }
    h1{
      margin:2px 0 0;
      font-size:24px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .meta{ margin-top:6px; font-size:12px; color:var(--muted); }

    /* ---------- responsive ---------- */
    @media (max-width:560px){
      .topbar{
        flex-direction:column;
        align-items:stretch;
      }
      .actions{
        justify-content:flex-end;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="left">
        <a class="btn" href="index.html">← กลับหน้าหมวด</a>
        <div class="titlebox">
          <p class="crumb" id="crumb">Sheet ›</p>
          <h1 id="pageTitle">Battery</h1>
          <p class="meta" id="updateText">อัปเดต: -</p>
        </div>
      </div>

      <!-- ✅ แคปชั่นซ้าย + ปุ่ม -->
      <div class="actions" id="actions">
        <div class="pdfHintLeft">
          <span>เปิดเพื่อดาวน์โหลด</span>
          <span class="arrow">➜</span>
        </div>

        <a class="btn btn-secondary"
           id="openPdfBtn"
           href="#"
           target="_blank"
           rel="noopener"
           style="display:none;">
          เปิด PDF
        </a>
      </div>
    </div>
  </div>

  <script src="price_sheet.js"></script>

  <!-- sync แสดง hint เมื่อปุ่ม PDF โผล่ -->
  <script>
    (function(){
      const actions = document.getElementById('actions');
      const btn = document.getElementById('openPdfBtn');

      function sync(){
        if (!actions || !btn) return;
        const visible = btn.style.display !== 'none' && btn.offsetParent !== null;
        actions.classList.toggle('has-pdf', visible);
      }

      sync();
      setTimeout(sync, 300);
      setTimeout(sync, 1000);
    })();
  </script>
</body>
</html>
