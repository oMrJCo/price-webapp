backend:
  name: git-gateway
  branch: main

site_url: https://sprightly-panda-ba302f.netlify.app
display_url: https://omrjco.github.io/price-webapp

media_folder: "assets/uploads"
public_folder: "/price-webapp/assets/uploads"

collections:
  - name: "categories_config"
    label: "Categories"
    files:
      - name: "categories"
        label: "All Categories"
        file: "categories.json"
        format: "json"
        fields:
          - { label: "Site Title", name: "siteTitle", widget: "string", required: false }
          - { label: "Site Subtitle", name: "siteSubtitle", widget: "string", required: false }
          - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
          - { label: "Cover Headline", name: "coverHeadline", widget: "string", required: false }
          - { label: "Cover Subtext", name: "coverSubtext", widget: "string", required: false }

          - label: "Categories"
            name: "categories"
            widget: "list"
            fields:
              - { label: "Title (EN)", name: "titleEN", widget: "string" }
              - { label: "Title (TH)", name: "titleTH", widget: "string" }

              - label: "Image"
                name: "image"
                widget: "image"
                hint: "แนะนำขนาด 1920×800 px (แนวนอน)"
                required: false
                media_folder: "assets/uploads/images"
                public_folder: "/price-webapp/assets/uploads/images"

              # ✅ NEW: ใช้หน้านี้เป็นหลัก (ฝังลิงก์หน้าเว็บแสดงราคา)
              - { label: "Sheet Tab (แนะนำ ถ้าใช้ price_sheet)", name: "sheetTab", widget: "string", required: false, hint: "ใส่ชื่อแท็บใน Google Sheet เช่น Battery (ระบบจะพาไป price_sheet.html?tab=Battery อัตโนมัติ)" }

              - { label: "Price Page Link (แนะนำ)", name: "price_url", widget: "string", required: false, hint: "วางลิงก์หน้าแสดงราคา เช่น https://omrjco.github.io/price-webapp/price_sheet.html?tab=Battery (ถ้าใส่ ระบบจะใช้ลิงก์นี้ก่อน)" }

              # ✅ Fallback: ยังใช้ PDF ได้ (กรณีบางหมวดยังเป็นไฟล์)
              - { label: "PDF Link (OPTIONAL)", name: "pdf", widget: "string", required: false, hint: "วางลิงก์ PDF ที่เปิดตรงได้ (ลงท้าย .pdf) — ใช้เมื่อไม่ได้ตั้งค่า Sheet Tab/Price Page Link" }

              - label: "PDF File (Upload) (OPTIONAL)"
                name: "pdf_file"
                widget: "file"
                hint: "แนบไฟล์ PDF ได้ (ระบบจะใช้เมื่อไม่มี Sheet Tab/Price Page Link และ PDF Link ว่าง)"
                required: false
                allow_multiple: false
                media_folder: "assets/uploads/pdfs"
                public_folder: "/price-webapp/assets/uploads/pdfs"
